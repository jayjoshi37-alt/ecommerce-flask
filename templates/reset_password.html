{% extends 'user_login.html' %}
{% block content %}
<section class="auth-page">
  <div class="auth-card-premium">
    <h2 class="auth-title">New Password 🔒</h2>
    <p class="auth-subtitle">Please set a strong password.</p>

    <form method="POST" onsubmit="return validatePassword()">
      <div class="form-group" style="margin-bottom:15px;">
        <input type="password" id="p1" name="password" class="form-control-premium" placeholder="New Password" required>
      </div>
      <div class="form-group" style="margin-bottom:20px;">
        <input type="password" id="p2" class="form-control-premium" placeholder="Confirm Password" required>
      </div>
      <button class="btn-auth">Update Password</button>
    </form>
  </div>
</section>

<script>
function validatePassword(){
  const p1 = document.getElementById('p1').value;
  const p2 = document.getElementById('p2').value;
  if(p1 !== p2) { alert("Passwords do not match!"); return false; }
  if(p1.length < 6) { alert("Password must be at least 6 characters."); return false; }
  return true;
}
</script>
{% endblock %}
