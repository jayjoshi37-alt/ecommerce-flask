<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

     <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --glam-pink: #ff007f;
            --glam-purple: #8a2be2;
            --navy-blue: #1e3a8a;
            --dark-navy: #1e40af;
            --glass: rgba(255, 255, 255, 0.95);
        }

        /* Main Content Area - Compatible with existing sidebar CSS */
        .main-content {
            margin-left: 270px;
            padding: 40px;
            width: calc(100% - 270px);
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        /* Live Dashboard Header */
        .sale-header {
            background: linear-gradient(135deg, var(--navy-blue) 0%, var(--dark-navy) 50%, var(--glam-purple) 100%);
            padding: 40px;
            border-radius: 25px;
            color: white;
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 20px 40px rgba(30, 58, 138, 0.3);
            position: relative;
            overflow: hidden;
        }

        .sale-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,0,127,0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .sale-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 0;
            z-index: 1;
        }

        .sale-header p {
            opacity: 0.9;
            font-size: 1.1rem;
            margin: 5px 0 0 0;
            z-index: 1;
        }

        /* Live Stats Cards */
        .live-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .stat-card:hover {
            transform: translateY(-10px);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--glam-pink), var(--glam-purple));
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--navy-blue);
            margin-bottom: 5px;
        }

        .stat-label {
            color: #64748b;
            font-weight: 600;
            font-size: 0.95rem;
        }

        /* Enhanced Sale Grid */
        .sale-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        /* Sale Card */
        .sale-card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            overflow: hidden;
            position: relative;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .sale-card:hover {
            transform: translateY(-20px) scale(1.02);
            box-shadow: 0 30px 60px rgba(255, 0, 127, 0.25);
        }

        .card-img-container {
            position: relative;
            height: 220px;
            overflow: hidden;
        }

        .card-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .sale-card:hover .card-img-container img {
            transform: scale(1.1);
        }

        .badge-discount {
            position: absolute;
            top: 20px;
            left: 20px;
            background: linear-gradient(135deg, var(--glam-pink), var(--glam-purple));
            color: white;
            padding: 8px 20px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 15px;
            animation: pulse 2s infinite;
            box-shadow: 0 5px 15px rgba(255,0,127,0.4);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .card-body {
            padding: 25px;
        }

        .sale-title {
            font-size: 13px;
            text-transform: uppercase;
            color: var(--glam-purple);
            font-weight: 700;
            letter-spacing: 1.2px;
            margin-bottom: 8px;
        }

        .prod-name {
            font-size: 20px;
            font-weight: 700;
            margin: 0 0 12px 0;
            color: #1e293b;
            line-height: 1.3;
        }

        .timer-box {
            background: linear-gradient(135deg, #f8fafc, #e2e8f0);
            padding: 12px 16px;
            border-radius: 15px;
            font-size: 12px;
            margin: 15px 0;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #475569;
            font-weight: 600;
            border: 1px solid rgba(255,0,127,0.1);
        }

        .price-section {
            font-size: 22px;
            font-weight: 800;
            color: var(--glam-pink);
            margin: 15px 0;
        }

        .original-price {
            font-size: 14px;
            color: #94a3b8;
            text-decoration: line-through;
            margin-left: 12px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border-top: 2px dashed #e2e8f0;
        }

        .status-badge {
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-active {
            background: rgba(34, 197, 94, 0.2);
            color: #10b981;
            border: 1px solid #10b981;
        }

        .status-inactive {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-edit {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
        }

        .btn-edit:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
        }

        .btn-delete {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }

        .btn-delete:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(239, 68, 68, 0.4);
        }

        /* Enhanced Add Button */
        .btn-add-sale {
            background: linear-gradient(135deg, var(--glam-pink), var(--glam-purple));
            color: white;
            border: none;
            padding: 18px 40px;
            border-radius: 15px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 10px 30px rgba(255, 0, 127, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-add-sale:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px rgba(255, 0, 127, 0.5);
        }

        /* Modal Styling - FIXED */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(15px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 600px;
            padding: 40px;
            border-radius: 25px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 30px 80px rgba(0,0,0,0.3);
            animation: slideInUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal h2 {
            color: var(--navy-blue);
            margin: 0 0 30px 0;
            font-size: 1.8rem;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 15px;
            border: 2px solid #f1f5f9;
            border-radius: 12px;
            outline: none;
            transition: all 0.3s ease;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            border-color: var(--glam-pink);
            box-shadow: 0 0 0 3px rgba(255,0,127,0.1);
            transform: translateY(-2px);
        }

        .form-row {
            display: flex;
            gap: 20px;
        }

        .form-row > div {
            flex: 1;
        }

        .form-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn-primary {
            flex: 2;
            background: linear-gradient(135deg, var(--glam-pink), var(--glam-purple));
            color: white;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-secondary {
            flex: 1;
            background: #f1f5f9;
            color: #64748b;
            border: 2px solid #e2e8f0;
            padding: 18px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(255,0,127,0.4);
        }

        .btn-secondary:hover {
            background: #e2e8f0;
            transform: translateY(-2px);
        }

        .image-preview {
            border: 2px dashed #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-top: 10px;
            background: #f8fafc;
            transition: all 0.3s ease;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .image-preview:hover {
            border-color: var(--glam-pink);
            background: rgba(255,0,127,0.05);
        }

        .image-preview img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .empty-state {
            text-align: center;
            padding: 80px 40px;
            color: #64748b;
        }

        .empty-state i {
            font-size: 5rem;
            color: #cbd5e1;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .main-content {
                margin-left: 0;
                width: 100%;
                padding: 20px;
            }
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }

font-size:28px;
font-weight:800;
background:linear-gradient(90deg,#ff2d75,#8a2be2);

    background: linear-gradient(90deg,#ff2d75,#8a2be2);

}

.nav-link:not(.active):hover {
    background: rgba(255,0,127,0.08);
    color: #ff007f;
}
    </style>
</head>
